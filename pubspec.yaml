name: bolox
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  nearby_connections: ^4.3.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  permission_handler: ^12.0.0
  speech_to_text: ^7.4.0
  flutter_blue_plus: ^2.3.12
  tflite_flutter: ^0.12.1
  onnxruntime: ^1.4.1
  sherpa_onnx: ^1.13.7
  flutter_tts: ^4.2.5
  translator: ^1.0.4+1
  google_mlkit_translation: ^0.14.0
  perfect_volume_control: ^1.0.6
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  geolocator: ^14.0.2
  app_settings: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
